name: Shell-Guard PR Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read      # 코드를 읽기 위해 필요
  pull-requests: write # PR에 댓글을 달기 위해 필수

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      # 1. 현재 레포지토리 체크아웃 (Diff를 위해 전체 히스토리 가져오기 필수)
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # 중요: 이거 없으면 git diff가 안 됩니다!

      # 2. 필수 패키지 설치 (jq)
      - name: Setup environment
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          
          # 만약 patterns.txt가 없다면 기본값 생성 (에러 방지용)
          if [ ! -f scripts/config/patterns.txt ]; then
            echo "Creating default patterns.txt..."
            mkdir -p scripts/config
            echo "AWS_ACCESS_KEY_ID" > scripts/config/patterns.txt
            echo "SLACK_WEBHOOK_URL" >> scripts/config/patterns.txt
            echo "PRIVATE_KEY" >> scripts/config/patterns.txt
          fi

      # 3. 분석 스크립트 실행
      - name: Run Shell-Guard Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # GitHub Actions 이벤트 정보 주입
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "🔍 Starting Analysis..."
          
          # 실행 권한 부여
          chmod +x scripts/main_analyzer.sh
          chmod +x scripts/modules/*.sh
          
          # 메인 스크립트 실행 (경로 주의: scripts 폴더가 루트에 있다고 가정)
          ./scripts/main_analyzer.sh