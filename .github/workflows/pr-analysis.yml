name: Shell-Guard Security Check
- name: Prepare patterns file
  run: |
    cp shell-guard-tool/scripts/config/patterns.txt.example \
       shell-guard-tool/scripts/config/patterns.txt
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read      # 코드를 읽어야 함
  pull-requests: write # PR에 댓글을 달아야 함

jobs:
  shell-guard-scan:
    runs-on: ubuntu-latest
    steps:
      # 1. 분석할 대상 코드(현재 레포) 가져오기
      - name: Checkout Target Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Diff 분석을 위해 필수

      # 2. 분석 도구(Shell-Guard) 가져오기 (핵심!)
      - name: Checkout Shell-Guard Tool
        uses: actions/checkout@v3
        with:
          repository: bumfercar/Shell-Guard  # 사용자님의 도구 레포 주소
          path: shell-guard-tool             # 이 폴더 이름으로 다운로드됨
          ref: main                          # main 브랜치 사용

      # 3. 환경 설정 (jq 설치)
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y jq

      # 4. Shell-Guard 실행
      - name: Run Analysis
        env:
          # 이 레포지토리(Target)의 시크릿을 사용합니다.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} 
          
          # GitHub Context 정보 주입
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          echo "🚀 Starting Shell-Guard from external repo..."
          
          # 실행 권한 부여 (다운로드 받은 도구 폴더 안의 스크립트)
          chmod +x shell-guard-tool/scripts/main_analyzer.sh
          chmod +x shell-guard-tool/scripts/modules/*.sh
          
          # 스크립트 실행 (경로 주의!)
          ./shell-guard-tool/scripts/main_analyzer.sh